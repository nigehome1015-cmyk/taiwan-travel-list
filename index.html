function buildDirectionsUrl(selected){const params=new URLSearchParams({api:"1",destination:selected[selected.length-1].name+" "+(selected[selected.length-1].address||selected[selected.length-1].county),travelmode:"driving"});if(selected.length>1)params.set("waypoints",selected.slice(0,-1).map(p=>p.name+" "+(p.address||p.county)).join("|"));return "https://www.google.com/maps/dir/?"+params.toString()}
let activeMapPlace=null, activeMapOrigin='';
const mapPopover=document.querySelector('#mapPopover'), mapPopFrame=document.querySelector('#mapPopFrame');
function requestPlaceLocation(){const status=document.querySelector('#mapPopStatus');if(!activeMapPlace)return;if(!navigator.geolocation){status.textContent='這個瀏覽器無法提供目前位置；可直接開啟 Google 導航。';return}status.textContent='正在取得目前位置…';navigator.geolocation.getCurrentPosition(pos=>{const origin=pos.coords.latitude+','+pos.coords.longitude;activeMapOrigin=origin;const dest=[activeMapPlace.name,activeMapPlace.address||activeMapPlace.county,'台灣'].filter(Boolean).join(' ');mapPopFrame.src='https://maps.google.com/maps?saddr='+encodeURIComponent(origin)+'&daddr='+encodeURIComponent(dest)+'&output=embed';const url=new URL(buildDirectionsUrl([activeMapPlace]));url.searchParams.set('origin',origin);document.querySelector('#mapPopOpen').href=url.toString();status.textContent='已用目前位置顯示到目的地的路線預覽。';},()=>{status.textContent='無法取得位置；請允許瀏覽器定位，或直接開啟 Google 導航。';},{enableHighAccuracy:false,timeout:10000,maximumAge:60000})}
function showPlaceMap(place,event){activeMapPlace=place;activeMapOrigin='';document.querySelector('#mapPopTitle').textContent='前往 '+place.name;document.querySelector('#mapPopAddress').textContent=[place.county,place.address].filter(Boolean).join(' · ');document.querySelector('#mapPopStatus').textContent='地圖顯示目的地；正在嘗試取得目前位置…';const destination=[place.name,place.address||place.county,'台灣'].filter(Boolean).join(' ');mapPopFrame.src='https://maps.google.com/maps?q='+encodeURIComponent(destination)+'&output=embed';document.querySelector('#mapPopOpen').href=buildDirectionsUrl([place]);mapPopover.hidden=false;const x=event.clientX,y=event.clientY;const w=Math.min(390,innerWidth-24),h=390;mapPopover.style.left=Math.max(12,Math.min(x+14,innerWidth-w-12))+'px';mapPopover.style.top=Math.max(12,Math.min(y+12,innerHeight-h-12))+'px';requestPlaceLocation()}
document.querySelector('#mapPopClose').addEventListener('click',()=>mapPopover.hidden=true);
document.querySelector('#mapPopLocate').addEventListener('click',requestPlaceLocation);
document.addEventListener('click',e=>{if(!mapPopover.hidden&&!mapPopover.contains(e.target)&&!e.target.closest('.map-route-link'))mapPopover.hidden=true});

function renderMap(){const mapCard=document.querySelector("#routeMapCard");mapCard.hidden=view!=="route";if(view!=="route")return;const selected=routeStops.map(k=>items.find(p=>keyOf(p)===k)).filter(Boolean);const p=selected.length?selected[selected.length-1]:null;const label=p?"目前終點 · "+p.name:"尚未加入路線";const query=p?[p.name,p.address,p.county,"台灣"].filter(Boolean).join(" "):county.value||"台灣景點";const url="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(query);document.querySelector("#routeMapTitle").textContent=selected.length?"行程地圖預覽 · "+selected.length+" 站":"行程地圖預覽";document.querySelector("#routeMapNote").textContent=selected.length?"地圖先定位目前終點；完整多站路線請按下方按鈕":"選擇上方收藏地點加入行程，地圖會跟著更新";document.querySelector("#routeStopSummary").textContent=selected.length?selected.map((p,i)=>(i+1)+". "+p.name).join("　→　"):"尚未加入地點";document.querySelector("#routeOpenMap").textContent=selected.length?"開啟完整路線 ↗":"用 Google 地圖查看 ↗";document.querySelector("#routeOpenMap").href=selected.length?buildDirectionsUrl(selected):url;const frame=document.querySelector("#routeMapFrame"),embed="https://maps.google.com/maps?q="+encodeURIComponent(query)+"&output=embed";if(frame.src!==embed)frame.src=embed}function renderRoute(){const panel=document.querySelector("#routePanel");panel.hidden=view!=="route";const selected=routeStops.map(k=>items.find(p=>keyOf(p)===k)).filter(Boolean);const chips=selected.map((p,i)=>'<span class="stop">'+(i+1)+'. '+esc(p.name)+'<button data-move="up" data-index="'+i+'" aria-label="往前移" '+(i===0?"disabled":"")+'>↑</button><button data-move="down" data-index="'+i+'" aria-label="往後移" '+(i===selected.length-1?"disabled":"")+'>↓</button></span>').join("");const mapLink=selected.length?'<a target="_blank" rel="noopener" href="'+buildDirectionsUrl(selected)+'">在 Google 地圖開啟路線 ↗</a>':"";panel.innerHTML='<div class="route-head"><span>我的行程 · '+selected.length+' 站</span><button id="clearRoute" class="tab">清空</button></div><p class="route-help">先收藏地點，再點「規劃路線」加入；可用箭頭調整順序。手機版 Google 地圖最多串接 4 站。</p><div class="route-stops">'+(chips||'<span class="route-help">尚未選擇地點</span>')+'</div><div class="route-actions">'+mapLink+'</div>';document.querySelector("#clearRoute").addEventListener("click",()=>{routeStops=[];try{localStorage.setItem("island-walk-route","[]")}catch(e){}render()});panel.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>{const i=Number(b.dataset.index),j=b.dataset.move==="up"?i-1:i+1;if(j>=0&&j<routeStops.length){[routeStops[i],routeStops[j]]=[routeStops[j],routeStops[i]];try{localStorage.setItem("island-walk-route",JSON.stringify(routeStops))}catch(e){}render()}}));renderMap()}
function render(){const q=search.value.trim().toLowerCase(),list=items.filter(p=>p.kind===kind&&(!county.value||p.county===county.value)&&(!cat.value||p.category===cat.value)&&(view==="all"||(view==="saved"||view==="route")&&saved.has(keyOf(p)))&&(!q||[p.name,p.county,p.category,p.desc,p.address].some(s=>String(s||"").toLowerCase().includes(q))));
document.querySelector("#count").textContent=view==="saved"?"我的收藏 · "+list.length+" 個地方":view==="route"?"選擇收藏地點加入路線 · "+list.length+" 個地方":"找到 "+list.length+" 個"+kind;
grid.innerHTML=list.length?list.map(p=>{const key=keyOf(p),on=saved.has(key),photo=photoMap[key];return '<article class="card"><div class="visual '+esc(p.style||"v1")+'">'+(photo?'<img class="place-photo" src="'+photo+'" alt="'+esc(p.name)+'">':'<span>'+esc(p.icon||"📍")+'</span>')+'<span class="badge">'+esc(p.category)+'</span><button class="heart '+(on?"on":"")+'" data-fav="'+esc(key)+'" aria-label="收藏">'+(on?"♥":"♡")+'</button></div><div class="body"><div class="region">'+esc(p.county)+' · '+esc(p.kind)+'</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.desc)+'</p><div class="address">⌖ '+esc(p.address||p.county)+'</div><div class="actions"><a class="map-route-link" href="'+buildDirectionsUrl([p])+'" target="_blank" rel="noopener">Google 地圖 ↗</a><button data-fav="'+esc(key)+'">'+(on?"已收藏 ♥":"加入收藏 ♡")+'</button><label class="photo-action">📷 '+(photo?"換照片":"加照片")+'<input type="file" accept="image/*" data-photo="'+esc(key)+'"></label></div><div class="manage-actions"><button data-edit="'+esc(key)+'">編輯</button><button data-delete="'+esc(key)+'">刪除</button></div>'+(view==="route"?'<button class="route-pick" data-route="'+esc(key)+'">'+(routeStops.includes(key)?"✓ 已加入路線":"＋ 加入路線")+'</button>':"")+'</div></article>'}).join(""):'<div class="empty">目前沒有符合的項目。<br>試試其他縣市或關鍵字吧。</div>';
grid.querySelectorAll(".map-route-link").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();const card=a.closest(".card"),name=card.querySelector("h2").textContent,place=items.find(p=>p.name===name&&p.kind===kind);if(place)showPlaceMap(place,e)}));grid.querySelectorAll("[data-fav]").forEach(b=>b.addEventListener("click",()=>{const key=b.dataset.fav;saved.has(key)?saved.delete(key):saved.add(key);try{localStorage.setItem("island-walk-saved",JSON.stringify([...saved]))}catch(e){}render()}));
grid.querySelectorAll("[data-route]").forEach(b=>b.addEventListener("click",()=>{const key=b.dataset.route;if(routeStops.includes(key))routeStops=routeStops.filter(x=>x!==key);else if(routeStops.length>=4)alert("手機版 Google 地圖一次最多串接 4 個地點，請先移除一站。");else routeStops.push(key);try{localStorage.setItem("island-walk-route",JSON.stringify(routeStops))}catch(e){}render()}));
grid.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{const key=b.dataset.edit,p=items.find(x=>keyOf(x)===key);if(!p)return;editingKey=key;addForm.hidden=false;document.querySelector("#addTitle").textContent="編輯地點";document.querySelector("#addKind").value=p.kind;fillAddCategories();document.querySelector("#addName").value=p.name;document.querySelector("#addCounty").value=p.county;document.querySelector("#addCategory").value=p.category;document.querySelector("#addAddress").value=p.address||"";document.querySelector("#addDesc").value=p.desc||"";refreshPlaceSearch();addForm.scrollIntoView({behavior:"smooth",block:"center"})}));
grid.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>{const key=b.dataset.delete,p=items.find(x=>keyOf(x)===key);if(!p||!confirm("確定刪除「"+p.name+"」嗎？"))return;items=items.filter(x=>keyOf(x)!==key);saved.delete(key);routeStops=routeStops.filter(x=>x!==key);delete photoMap[key];try{localStorage.setItem("island-walk-route",JSON.stringify(routeStops));saveItems();localStorage.setItem("island-walk-route",JSON.stringify(routeStops));localStorage.setItem("island-walk-saved",JSON.stringify([...saved]));localStorage.setItem("island-walk-route",JSON.stringify(routeStops));localStorage.setItem("island-walk-photos",JSON.stringify(photoMap))}catch(e){}render()}));
grid.querySelectorAll("[data-photo]").forEach(input=>input.addEventListener("change",()=>{const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);photoMap[input.dataset.photo]=canvas.toDataURL("image/jpeg",0.76);try{localStorage.setItem("island-walk-photos",JSON.stringify(photoMap));render()}catch(e){delete photoMap[input.dataset.photo];alert("照片太大，無法儲存在此瀏覽器。請選擇較小的照片。")}};img.src=reader.result};reader.readAsDataURL(file)}));
renderRoute()}
function refreshPlaceSearch(){const q=[document.querySelector("#addName").value,document.querySelector("#addAddress").value,document.querySelector("#addCounty").value,"台灣"].filter(Boolean).join(" ");document.querySelector("#searchPlaceMap").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}

document.querySelector("#toggleAdd").addEventListener("click",()=>{addForm.hidden=!addForm.hidden;if(!addForm.hidden){editingKey=null;addForm.reset();document.querySelector("#addTitle").textContent="新增到我的清單";fillAddCategories()}});

addForm.addEventListener("submit",e=>{e.preventDefault();const entry={kind:document.querySelector("#addKind").value,name:document.querySelector("#addName").value.trim(),county:document.querySelector("#addCounty").value,category:document.querySelector("#addCategory").value,icon:document.querySelector("#addKind").value==="美食"?"🍴":"📍",desc:document.querySelector("#addDesc").value.trim()||"我的自訂地點",address:document.querySelector("#addAddress").value.trim()||document.querySelector("#addCounty").value,style:"v"+(items.length%6+1)};if(!entry.name||!entry.county)return;if(editingKey){const i=items.findIndex(p=>keyOf(p)===editingKey);if(i<0)return;const oldKey=editingKey;items[i]={...items[i],...entry};const nextKey=keyOf(items[i]);if(nextKey!==oldKey){if(saved.has(oldKey)){saved.delete(oldKey);saved.add(nextKey)}routeStops=routeStops.map(k=>k===oldKey?nextKey:k);if(photoMap[oldKey]){photoMap[nextKey]=photoMap[oldKey];delete photoMap[oldKey]}}}else{if(items.some(p=>p.kind===entry.kind&&p.name===entry.name)){alert("這個名稱已經在清單裡了。");return}items.push(entry)}try{saveItems();localStorage.setItem("island-walk-saved",JSON.stringify([...saved]));localStorage.setItem("island-walk-photos",JSON.stringify(photoMap))}catch(e){alert("目前無法儲存資料。請先匯出備份或清理瀏覽器儲存空間。");return}kind=entry.kind;view="all";editingKey=null;document.querySelectorAll(".type").forEach(x=>x.classList.toggle("active",x.dataset.kind===kind));county.value="";cat.value="";search.value="";addForm.reset();addForm.hidden=true;document.querySelector("#addTitle").textContent="新增到我的清單";updateOptions();render()});

document.querySelector("#exportData").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({version:1,items,saved:[...saved],photos:photoMap,routeStops},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="島上走走備份.json";a.click();URL.revokeObjectURL(a.href)});document.querySelector("#importData").addEventListener("change",e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.items))throw new Error("format");items=data.items;saved=new Set(data.saved||[]);routeStops=data.routeStops||[];for(const k of Object.keys(photoMap))delete photoMap[k];Object.assign(photoMap,data.photos||{});saveItems();localStorage.setItem("island-walk-saved",JSON.stringify([...saved]));localStorage.setItem("island-walk-photos",JSON.stringify(photoMap));updateOptions();render();alert("備份已還原。")}catch(err){alert("無法讀取這個備份檔。")}};reader.readAsText(file);e.target.value=""});</script></body></html>
